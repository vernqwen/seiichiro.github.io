<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositori Berkas Digital Ultra Cepat</title>
    <style>
        /* --- RESET & ROOT VARIABLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --accent-color: #58a6ff;
            --accent-hover: #1f6feb;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --shadow-matrix: rgba(0, 0, 0, 0.5);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 650px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px var(--shadow-matrix);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        header h1 {
            font-size: 1.8rem;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .file-item {
            display: flex;
            align-items: center;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px 20px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            position: relative;
            overflow: hidden;
            width: 100%;
            text-align: left;
        }

        /* Hover jika file aktif/tersedia */
        .file-item:not(.corrupted):hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
            box-shadow: 0 5px 15px rgba(88, 166, 255, 0.1);
        }

        /* Styling Visual jika Jalur Link Corrupt/Rusak */
        .file-item.corrupted {
            background-color: #1a1515;
            border-color: #442323;
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Modifikasi Ikon Permanen Folder */
        .file-icon {
            width: 45px;
            height: 45px;
            background-color: rgba(88, 166, 255, 0.1);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            font-size: 1.3rem; /* Menyesuaikan visual emoji folder agar pas */
            flex-shrink: 0;
            border: 1px solid rgba(88, 166, 255, 0.2);
        }

        /* Warna Ikon Khusus jika Corrupt */
        .file-item.corrupted .file-icon {
            background-color: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.2);
        }

        .file-details {
            flex-grow: 1;
        }

        .file-title {
            color: #ffffff;
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 4px;
            transition: color 0.2s ease;
        }

        .file-item:not(.corrupted):hover .file-title {
            color: var(--accent-color);
        }

        .file-meta {
            color: var(--text-muted);
            font-size: 0.75rem;
            display: flex;
            gap: 15px;
        }

        .meta-item strong {
            color: #a3b3c2;
            font-weight: 500;
        }

        .status-ok {
            color: #56d364;
            font-weight: 600;
        }

        .status-fail {
            color: #f85149;
            font-weight: 600;
        }

        .action-indicator {
            color: var(--text-muted);
            font-size: 1.2rem;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .file-item:not(.corrupted):hover .action-indicator {
            color: var(--accent-color);
            transform: translateX(3px);
        }

        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <!-- LINGKAR BIRU & LINGKAR KUNING DI SINI -->
            <h1>🗂️ Katakese-Jion</h1>
            <p>Siapakah Yang Seperti ALLAH ?</p>
        </header>

        <!-- Container Utama Tempat Tombol Dibuat Otomatis -->
        <div id="file-container" class="file-list"></div>

        <footer>
            <!-- LINGKAR MERAH DI SINI -->
            <p>St.Maria Bunda Allah Doakanlah Kami, St.Thomas Aquinas Doakanlah Kami</p>
        </footer>
    </div>

<script>
    // ==============================================================
    // DATABASE DATA LINK (Hanya Perlu Isi Nama File dan URL Saja!)
    // ==============================================================
    // Angka indeks depan ("01. ", "02. ", dst.) akan digenerate otomatis 
    // oleh sistem sesuai dengan posisi urutan tombolnya di bawah ini.
    const databaseLink = [
        { 
            namaFile: "Summa Theologica (Complete English Edition in One Volume), Translated by the Fathers of the English Dominican Province (Benziger Brothers, 1947)", 
            url: "https://drive.google.com/drive/folders/1S6RoRF1GHYTa28WMbB3efBfAllqZA6b1" 
        },
        { 
            namaFile: "Katekismus Gereja Katolik/Catechism of the Catholic Curch", 
            url: "https://drive.google.com/drive/folders/1P0EczHMqDR5zcxYhhTpPK_mcEEqKhiHT" 
        },
        { 
            namaFile: "Alkitab PL&PB Asli Bahasa Ibrani dan Yunani", 
            url: "https://drive.google.com/drive/folders/1l2Zbm4OlYEEH5sgTD4n4smH4knhCylWY" 
        },
        { 
            namaFile: "Website Katekismus Gereja Katolik Online", 
            url: "https://vernqwen.github.io/kgk-online/" 
        },
        { 
            namaFile: "Summa Contra Gentiles", 
            url: "https://drive.google.com/drive/folders/1Zs9q7U5ceQ48XmgEy-qGDDK6IXqJePD7" 
        }
    ];

    // ==============================================================
    // AUTOMATION CORE ENGINE
    // ==============================================================
    const container = document.getElementById("file-container");

    // Fungsi Cerdas Memvalidasi Kesiapan Jalur Link (Status)
    function deteksiStatus(url) {
        if (!url) return { teks: "Tidak Tersedia", valid: false };
        
        // Proteksi jika jalur mengandung indikasi rusak, kosong, atau tidak diawali http/https
        if (url.includes("corrupt") || url.includes("mati") || !url.startsWith("http")) {
            return { teks: "Tidak Tersedia", valid: false };
        }
        
        return { teks: "Tersedia", valid: true };
    }

    // Fungsi Utama untuk Membangun Komponen Tombol ke Layar
    function bangunRepositoriOtomatis(dataArray) {
        container.innerHTML = "";

        dataArray.forEach((item, index) => {
            // Jalankan mesin deteksi kesiapan status link
            const infoStatus = deteksiStatus(item.url);

            // Logika Penomoran Format Permanen: 01-9999.(spasi)nama file
            // Menggunakan String.padStart agar jika nomor di bawah 10 otomatis diberi angka 0 di depannya (01, 02... 10... 100)
            const nomorUrut = String(index + 1).padStart(2, '0');
            const namaFormatPermanen = `${nomorUrut}. ${item.namaFile}`;

            // Buat elemen tag link <a>
            const aTag = document.createElement("a");
            aTag.className = `file-item ${infoStatus.valid ? '' : 'corrupted'}`;
            
            if (infoStatus.valid) {
                aTag.href = item.url;
                aTag.target = "_blank";
                aTag.rel = "noopener noreferrer";
            } else {
                aTag.href = "#";
                aTag.onclick = (e) => e.preventDefault(); // Kunci navigasi jika status mati/rusak
            }

            // Suntik struktur HTML baru yang bersih (Hanya menyisakan status) ke dalam DOM
            aTag.innerHTML = `
                <div class="file-icon">📁</div>
                <div class="file-details">
                    <div class="file-title">${namaFormatPermanen}</div>
                    <div class="file-meta">
                        <span class="meta-item"><strong>Status:</strong> <span class="${infoStatus.valid ? 'status-ok' : 'status-fail'}">${infoStatus.teks}</span></span>
                    </div>
                </div>
                <div class="action-indicator">${infoStatus.valid ? '➔' : '🔒'}</div>
            `;
            
            container.appendChild(aTag);
        });
    }

    // Eksekusi pembangunan antarmuka repositori secara instan
    bangunRepositoriOtomatis(databaseLink);
</script>

</body>
</html>
